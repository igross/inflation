name: Tests (synthetic data)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: |
          install.packages(c("readabs", "readxl", "tidyverse", "lubridate", "scales",
                             "patchwork", "gt", "shiny", "testthat", "openxlsx",
                             "png", "xml2"))
        shell: Rscript {0}
      - name: Run tests (no network access to ABS needed)
        run: Rscript tests/testthat.R
